services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finix
      POSTGRES_USER: finix
      POSTGRES_PASSWORD: finix_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - finix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finix -d finix"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev_admin_only
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak/finix-realm.json:/opt/keycloak/data/import/finix-realm.json:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: dev_grafana_only
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

volumes:
  finix_pg:
