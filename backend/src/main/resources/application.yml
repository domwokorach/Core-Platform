spring:
  application:
    name: finix-core-banking
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # UK civil time for date_trunc('month', now()) etc.; timestamps remain timestamptz (absolute instants).
      connection-init-sql: SET TIME ZONE 'Europe/London'
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  allowed-origin: ${APP_ALLOWED_ORIGIN}
  required-client-id: ${OIDC_CLIENT_ID}
  jwk-set-uri: ${OIDC_JWKS_URI:}
  audience: ${OIDC_AUDIENCE}
  expose-prometheus: false
  expose-api-docs: false
  market:
    # Twelve Data. The key comes ONLY from the backend environment and is never sent to the browser.
    api-key: ${TWELVE_DATA_API_KEY:}
    base-url: https://api.twelvedata.com
    credits-per-minute: ${TWELVE_DATA_CREDITS_PER_MINUTE:8}   # Basic plan: 8/min, 800/day
    realtime-entitled: ${MARKET_DATA_REALTIME_ENTITLED:false} # set true only if your plan includes real-time for these symbols
    poll-seconds: 30
  paper:
    # Alpaca PAPER trading only (simulated). Live trading is refused in code. Leave unset to disable.
    key-id: ${ALPACA_API_KEY_ID:}
    secret-key: ${ALPACA_API_SECRET_KEY:}
  events:
    heartbeat-seconds: 20
    max-connections-per-customer: 5
    max-connections-total: 2000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
