name: Publish container images (optional)

# OPTIONAL. Local Docker development never needs this workflow or any published image.
# Manual only. It builds and publishes to GitHub Container Registry after CI passes AND a reviewer approves the
# `ghcr-publish` environment (repository Settings > Environments; add required reviewers). Nothing is published automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. 0.1.0-dev (no leading v)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build, scan and push (${{ matrix.image }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ghcr-publish        # approval gate: configure required reviewers in the repository settings
    permissions:
      contents: read
      packages: write                # GITHUB_TOKEN only; no other credentials are used
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/core-platform-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,format=short,prefix=sha-
      # Build locally first and scan, so a vulnerable image is never pushed.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: scan:${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan:${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # The frontend image bakes in browser-public NEXT_PUBLIC_* URLs (defaults point at localhost); it contains no secrets.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
